# 图片专用反代片段（nginx）
#
# 作用有两个：
#   1. `/api/v1/media/*` 直接打后端，绕开 Next 的 `/api` 转发，少一跳 Node；
#   2. 在 nginx 存一份，跨用户共享 —— 别人已经拉过的头像/封面不再回源。
#
# 用法：把整段 include 进你的 server {} 里，放在 `location /` 之前。
# 后端端口按实际部署改（compose 默认发布到 127.0.0.1:8860）。
#
#   include /etc/nginx/snippets/media-cache.conf;
#
# 注意：`proxy_cache_path` 只能写在 http {} 层级，不能放到 server 里；
# 如果你的配置结构不同，把这一行挪到 http {} 即可。

proxy_cache_path /var/cache/nginx/media
                 levels=1:2
                 keys_zone=media_cache:32m
                 max_size=2g
                 inactive=30d
                 use_temp_path=off;

location ^~ /api/v1/media/ {
    proxy_pass http://127.0.0.1:8860;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 缓存键包含 ?w=，不同尺寸各存一份
    proxy_cache            media_cache;
    proxy_cache_key        $scheme$request_method$host$request_uri;
    proxy_cache_valid      200 30d;
    proxy_cache_lock       on;      # 同一张图并发只回源一次
    proxy_cache_use_stale  error timeout updating;
    add_header             X-Cache-Status $upstream_cache_status always;

    # 图片是二进制，别让 gzip 白忙；大图走 sendfile
    gzip off;
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    # 上传走同一前缀（POST），不缓存
    proxy_cache_bypass $http_cache_control;
    proxy_no_cache     $http_cache_control;
}
