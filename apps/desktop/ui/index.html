<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云轨社区</title>
  <style>
    html,body{margin:0;height:100%;background:#f3f5f9;color:#151a23;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    main{height:100%;display:grid;place-items:center;text-align:center;padding:32px}
    .dot{width:44px;height:44px;border-radius:14px;margin:0 auto 16px;background:linear-gradient(145deg,#3e7cff,#2b63e0);box-shadow:0 12px 30px -14px #3e7cff}
    p{color:#6b7688;font-size:13px;line-height:1.8}
  </style>
</head>
<body>
  <main>
    <div>
      <div class="dot"></div>
      <h1 style="font-size:18px;margin:0 0 6px">正在打开云轨社区…</h1>
      <p>如果长时间没有反应，请检查网络，或重新打开客户端。</p>
    </div>
  </main>
</body>
</html>
