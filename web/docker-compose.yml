services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blockarena/web:2026.10.20
    container_name: blockarena-web
    restart: unless-stopped

    # 进程级参数与密钥从同目录 .env 读（可选，没有也能启动）。
    # 站点名 / 人机验证 / 爱发电 / 注册开关不在这里 —— 去后台「站点设置」改。
    # 改 .env 后必须 `docker compose up -d` 重建容器，restart 不重读环境变量。
    environment:
      DATA_DIR: /data
      PORT: "8900"
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_VERSION: ${APP_VERSION:-2026.10.20-1}
      ENABLE_DEV_CONSOLE: ${ENABLE_DEV_CONSOLE:-}

    # 只绑本机，由 nginx / Caddy 对外；想直接暴露改成 "8900:8900"
    ports:
      - "127.0.0.1:8900:8900"

    volumes:
      - blockarena-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8900/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  blockarena-data:
    name: blockarena-data
