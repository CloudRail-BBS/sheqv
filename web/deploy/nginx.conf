# 反向代理示例：TLS 终止 + 转发到本机 8900
# 放到 /etc/nginx/conf.d/arena.conf，改域名与证书路径后 nginx -t && systemctl reload nginx

upstream blockarena {
    server 127.0.0.1:8900;
    keepalive 32;
}

server {
    listen 80;
    server_name arena.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arena.example.com;

    ssl_certificate     /etc/letsencrypt/live/arena.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 与 cap.limits.maxUploadBytes（2GB）对齐；微信内 300MB 也在此范围内
    client_max_body_size 2100m;

    # 压缩（Next 自己不再压，交给反代）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源：内容哈希命名，可长缓存
    location /_next/static/ {
        proxy_pass http://blockarena;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://blockarena;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket（预留：公会/战队实时频道）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 大文件上传 + 流式响应
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查不对外
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://blockarena;
    }
}
