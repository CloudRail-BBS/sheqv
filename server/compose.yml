# 后端栈：db（PostgreSQL）+ api（Rust）
#
#   cd server
#   cp .env.example .env      # 改 POSTGRES_PASSWORD
#   docker compose up -d --build
#
# 这份文件**只描述后端**，web 在 ../web/compose.yml。两边通过外部网络
# `blockarena-net` 互通（本文件负责创建它，所以后端必须先起）。
#
# 为什么拆开：三个容器的构建上下文、环境变量、端口、健康检查都在各自目录里，
# 改 web 不需要碰后端配置，也不再有一份"什么都在里面"的大 compose。
#
# 说明：
# - db 不发布端口，只在容器网络内可达；运维用 `docker compose exec db psql`
# - api 容器内 8080，宿主机只发布到回环 8860（8080 常被服务器上别的服务占用）
# - 卷名固定为 blockarena-*，即使换目录/重建项目也不会丢数据

name: blockarena

services:
  db:
    # 固定 17：18 把默认 PGDATA 改成了 /var/lib/postgresql/18/docker，
    # 与常见挂载点不一致，首次启动容易直接退出。
    image: postgres:17-alpine
    container_name: blockarena-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 server/.env 里设置 POSTGRES_PASSWORD（.env.example 是模板）}
      # 显式钉住数据目录，避免镜像默认值变化导致挂载点与 PGDATA 不一致
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - arena
    healthcheck:
      # 用 TCP 探，避免初始化阶段 socket 已存在但未就绪的假阳性
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U arena -d arena"]
      interval: 5s
      timeout: 5s
      retries: 12
      # 首次 initdb 在慢盘上要十几秒，给够时间再判定 unhealthy
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: blockarena/api:2026.10.24
    container_name: blockarena-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@db:5432/arena
      PORT: "8080"
      DATA_DIR: /data
      TZ: Asia/Shanghai
      RUST_LOG: ${RUST_LOG:-info,arena_api=info}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_VERSION: ${APP_VERSION:-2026.10.24}
      # 默认连下面的 redis 服务；想退回进程内实现就把这里显式设成空字符串
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      # 只放 .session-secret；多实例部署必须显式配 SESSION_SECRET
      - session-secret:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 容器内 8080 → 宿主机回环 8860。8080 留给服务器上已有的服务。
      - "127.0.0.1:${API_HOST_PORT:-8860}:8080"
    networks:
      arena:
        # 固定别名：web 在自己的 compose 项目里也要能用 `http://api:8080`
        aliases:
          - api
    healthcheck:
      test: ["CMD", "/usr/local/bin/arena-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # 缓存与限流。默认随栈启动（不配也能跑：API 连不上会降级为进程内）。
  # 不想用 Redis 就 `docker compose up -d db api`，或把 REDIS_URL 设成空字符串。
  redis:
    image: redis:7-alpine
    container_name: blockarena-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - arena
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  arena:
    # 固定网络名：web/compose.yml 以 external 方式接入，名字必须一致
    name: blockarena-net

volumes:
  pgdata:
    name: blockarena-pgdata
  session-secret:
    name: blockarena-session-secret
