[package]
name = "arena-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "方块竞技场后端：axum + PostgreSQL"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.12"
md-5 = "0.10"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "webpki-roots",
    "form",
    "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "chrono",
    "json",
    "migrate",
    "macros",
    "runtime-tokio",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# 关于 TLS：
# 数据库与出站 HTTP 现在都走明文，仅用于容器内网（compose 里 db 不发布端口）。
# 需要连云托管 PG（要求 sslmode=require）时，再加：
#   sqlx = { ..., features = ["tls-rustls-ring"] }
# 不要选 aws-lc-rs 版本：它需要 cmake + nasm，多机环境常缺（本机就编不过）。

